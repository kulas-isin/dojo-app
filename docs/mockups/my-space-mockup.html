<title>PawDojo · 我的空間 Mockup</title>
<style>
  :root{
    --cream:#fbf6ee; --card:#fff; --ink:#241f1b; --ink2:#4a4038;
    --coral:#e8805c; --coral-dk:#c9613f; --sage:#5e9b7e; --gold:#f6c453; --gold-dk:#c9922e;
    --border:#e6dccb; --dim:#8a7d68;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#17130f; color:var(--ink);
    font-family:"DejaVu Sans Mono","SFMono-Regular",Menlo,Consolas,monospace;
    display:flex; align-items:center; justify-content:center; min-height:100%; padding:14px;
  }
  .phone{
    width:100%; max-width:420px; aspect-ratio:9/16; max-height:calc(100vh - 28px);
    background:var(--cream); border-radius:22px; overflow:hidden; position:relative;
    border:3px solid #3a332c; box-shadow:0 24px 60px rgba(0,0,0,.55);
    display:flex; flex-direction:column;
  }
  .px{text-shadow:1.5px 1.5px 0 rgba(0,0,0,.18)}

  /* top bar */
  .top{display:flex; align-items:center; justify-content:space-between; padding:13px 16px 10px}
  .top h1{font-size:18px; letter-spacing:.5px}
  .top h1 b{color:var(--coral)}
  .cans{
    display:flex; align-items:center; gap:6px; background:var(--ink); color:#fff;
    border:2px solid #000; border-radius:10px; padding:6px 11px; font-weight:800; font-size:14px;
    box-shadow:2px 2px 0 rgba(0,0,0,.4);
  }
  .cans .rate{font-size:10px; color:var(--gold); font-weight:700}

  /* yard */
  .yard{position:relative; margin:0 12px; border-radius:16px; overflow:hidden; border:3px solid var(--ink); box-shadow:4px 5px 0 rgba(0,0,0,.15)}
  #scene{display:block; width:100%; image-rendering:pixelated}
  .walk{
    position:absolute; right:10px; bottom:10px; z-index:3;
    display:flex; align-items:center; gap:6px;
    background:var(--sage); color:#fff; border:2px solid var(--ink); border-radius:999px;
    padding:8px 14px; font-weight:800; font-size:13px; cursor:pointer;
    box-shadow:2px 3px 0 rgba(0,0,0,.35);
  }
  .walk:active{transform:translate(1px,2px)}
  .float{position:absolute; z-index:4; font-weight:900; font-size:14px; color:var(--gold-dk); pointer-events:none;
    text-shadow:1px 1px 0 #fff; animation:floatup 1s ease forwards}
  @keyframes floatup{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}

  /* tabs */
  .tabs{display:flex; gap:8px; padding:12px 16px 8px}
  .tabs button{
    flex:1; border:2px solid var(--ink); border-radius:10px; padding:8px 0; font-size:14px; font-weight:800;
    cursor:pointer; background:var(--card); color:var(--ink); box-shadow:2px 2px 0 rgba(0,0,0,.1);
  }
  .tabs button.on{background:var(--coral); color:#fff}

  .panel{flex:1; overflow-y:auto; padding:2px 14px 12px}
  .panel::-webkit-scrollbar{width:0}

  .petCard, .shopItem{
    background:var(--card); border:2px solid var(--border); border-radius:14px;
    padding:10px 12px; margin-bottom:9px; display:flex; align-items:center; gap:12px;
  }
  .petCard canvas{width:48px; height:48px; image-rendering:pixelated; flex:none; background:var(--sage); border-radius:11px}
  .petInfo{flex:1; min-width:0}
  .petName{font-weight:800; font-size:14px}
  .petLv{font-size:11px; color:var(--dim); font-weight:700}
  .bar{height:9px; background:var(--cream); border:1.5px solid var(--ink); border-radius:6px; overflow:hidden; margin-top:5px}
  .bar span{display:block; height:100%; background:linear-gradient(90deg,var(--gold),var(--coral)); width:0%; transition:width .25s}
  .feed{
    border:2px solid var(--ink); background:var(--gold); color:var(--ink); font-weight:800; font-size:12px;
    border-radius:10px; padding:8px 11px; cursor:pointer; box-shadow:2px 2px 0 rgba(0,0,0,.2); white-space:nowrap;
  }
  .feed:active{transform:translate(1px,1px)}
  .feed:disabled{opacity:.45; cursor:default}

  .shopItem .ico{width:44px; height:44px; border-radius:11px; background:var(--cream); border:2px solid var(--border);
    display:grid; place-items:center; font-size:22px; flex:none}
  .shopItem .buy{margin-left:auto; border:2px solid var(--ink); background:var(--sage); color:#fff; font-weight:800;
    font-size:12px; border-radius:10px; padding:8px 12px; cursor:pointer; box-shadow:2px 2px 0 rgba(0,0,0,.2)}
  .shopItem .buy.owned{background:var(--cream); color:var(--dim); border-color:var(--border); box-shadow:none; cursor:default}
  .shopItem .buy:active{transform:translate(1px,1px)}
  .hint{font-size:11px; color:var(--dim); font-weight:700; margin:2px 2px 10px}

  .toast{
    position:absolute; left:50%; top:42%; transform:translate(-50%,-50%) scale(.85); z-index:9;
    background:var(--ink); color:#fff; border:3px solid #000; border-radius:10px; padding:16px 22px;
    text-align:center; line-height:1.6; box-shadow:5px 6px 0 rgba(0,0,0,.45); opacity:0; pointer-events:none;
  }
  .toast .t{font-size:15px; font-weight:900}
  .toast .n{font-size:22px; font-weight:900; color:var(--gold); margin-top:6px}
  .toast.show{animation:pop 2.4s ease forwards}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.85)}8%{opacity:1;transform:translate(-50%,-50%) scale(1)}88%{opacity:1}100%{opacity:0}}
</style>

<div class="phone">
  <div class="top">
    <h1 class="px">我的<b>空間</b></h1>
    <div class="cans px">🥫 <span id="canN">0</span> <span class="rate" id="rate">+掛機中</span></div>
  </div>

  <div class="yard">
    <canvas id="scene" width="220" height="150"></canvas>
    <button class="walk" onclick="walk()">🚶 散步賺罐罐</button>
  </div>

  <div class="tabs">
    <button id="tabRaise" class="on" onclick="setTab('raise')">🍖 養成</button>
    <button id="tabDecor" onclick="setTab('decor')">🪴 佈置</button>
  </div>
  <div class="panel" id="panel"></div>

  <div class="toast" id="toast"></div>
</div>

<script>
(() => {
  const g = document.getElementById('scene').getContext('2d');
  const R = (x,y,w,h,c)=>{ g.fillStyle=c; g.fillRect(x,y,w,h); };
  const shade=(h,f)=>{const n=parseInt(h.slice(1),16);let r=(n>>16)*f,gg=((n>>8)&255)*f,b=(n&255)*f;
    const c=v=>Math.max(0,Math.min(255,v|0));return `rgb(${c(r)},${c(gg)},${c(b)})`;};

  // ---- state ----
  let cans = 320;
  const idleRate = 1;              // demo：每 tick +1（真實為每小時）
  let pets = [
    { name:'可可', type:'dog', fur:'#e8975c', lv:5, exp:40, need:100, x:60,  dir:1, ph:0 },
    { name:'麻糬', type:'cat', fur:'#f4f2ee', lv:3, exp:20, need:80,  x:120, dir:-1, ph:2 },
    { name:'橘子', type:'cat', fur:'#e8975c', lv:7, exp:70, need:120, x:170, dir:1, ph:4 },
  ];
  const SHOP = [
    { k:'bowl',  ico:'🥣', label:'食盆',   cost:30 },
    { k:'ball',  ico:'⚽', label:'玩具球', cost:20 },
    { k:'rug',   ico:'🟩', label:'草皮墊', cost:50 },
    { k:'plant', ico:'🌷', label:'花圃',   cost:40 },
    { k:'post',  ico:'🐈', label:'貓抓柱', cost:60 },
  ];
  const owned = {};                 // k -> true
  const placed = [];                // {k, x, y}
  const SLOTS = [[26,116],[196,120],[150,104],[44,132],[112,132]];
  let tab='raise';

  // ---- pixel pets ----
  function drawPet(ox, oy, p, t){
    const fur=p.fur, dark=shade(fur,.78), cat=p.type==='cat';
    const bob = Math.round(Math.sin(t/300 + p.ph)*1.2);
    oy += bob;
    R(ox+3, oy+18, 18, 2, 'rgba(0,0,0,.14)');           // shadow
    if(cat){ R(ox+19,oy+4,3,4,fur); R(ox+20,oy+1,2,4,fur); } else { R(ox+18,oy+9,5,4,dark); }  // tail/back ear
    R(ox+4, oy+7, 14, 8, fur);                            // body
    R(ox+4, oy+7, 14, 1, shade(fur,1.08));
    if(cat){ R(ox+3,oy,4,5,fur); R(ox+13,oy,4,5,fur); R(ox+4,oy,2,2,'#e8887f'); R(ox+14,oy,2,2,'#e8887f'); } // ears
    else { R(ox+1,oy+2,4,8,dark); R(ox+15,oy+2,4,8,dark); }                                                  // floppy ears
    R(ox+3, oy+2, 14, 8, fur);                            // head
    R(ox+6,oy+5,1,1,'#241f1b'); R(ox+12,oy+5,1,1,'#241f1b'); // eyes
    R(ox+9,oy+6,2,1,'#5a3a2e');                            // nose
    R(ox+5,oy+14,3,3,fur); R(ox+12,oy+14,3,3,fur);        // legs
  }

  // ---- decorations ----
  function drawDecor(d){
    const {k,x,y}=d;
    if(k==='bowl'){ R(x,y+4,16,4,'#b9b0a2'); R(x+2,y+2,12,3,'#8a5a3c'); R(x,y+7,16,2,'#9a9184'); }
    else if(k==='ball'){ R(x+2,y,8,2,'#e04848'); R(x,y+2,12,6,'#e04848'); R(x+2,y+8,8,2,'#e04848'); R(x+3,y+2,3,2,'#fff'); }
    else if(k==='rug'){ R(x,y+2,26,10,'#7cb489'); R(x,y+2,26,2,'#5e9b7e'); R(x,y+10,26,2,'#5e9b7e'); }
    else if(k==='plant'){ R(x+3,y+6,8,6,'#c97b4a'); R(x+2,y+2,4,5,'#4f9166'); R(x+8,y+1,4,6,'#4f9166'); R(x+5,y,3,4,'#e8809a'); }
    else if(k==='post'){ R(x+3,y,8,3,'#c9a26b'); R(x+5,y+3,4,10,'#a97c4e'); R(x+2,y+12,10,3,'#c9a26b'); }
  }

  function grass(){
    for(let y=0;y<150;y+=10) for(let x=0;x<220;x+=10){
      R(x,y,10,10, ((x/10+y/10)%2) ? '#6fa57c':'#74ab82');
      const h=((x*13)^(y*7))%7; if(h===0){g.fillStyle='#7cb489'; g.fillRect(x+3,y+6,2,2);} if(h===3){g.fillStyle='rgba(70,120,85,.35)'; g.fillRect(x+7,y+3,3,1);}
    }
    // fence
    for(let x=2;x<220;x+=16){ R(x,2,3,14,'#c9a26b'); R(x+1,2,1,14,shade('#c9a26b',.8)); }
    R(0,10,220,2,'#b98f5e'); R(0,4,220,2,'#c9a26b');
  }

  // ---- render loop ----
  function render(t){
    grass();
    const items=[...placed.map(d=>({y:d.y,d})), ...pets.map(p=>({y:118,p}))].sort((a,b)=>a.y-b.y);
    for(const it of items){ if(it.d) drawDecor(it.d); }
    for(const p of pets){
      p.x += p.dir*0.25;
      if(p.x>196){p.x=196;p.dir=-1;} if(p.x<8){p.x=8;p.dir=1;}
      drawPet(Math.round(p.x), 100, p, t);
    }
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  // ---- economy ----
  const canN=document.getElementById('canN');
  function setCans(v){ cans=v; canN.textContent=cans; renderPanel(); }
  setInterval(()=>{ cans+=idleRate; canN.textContent=cans; }, 800);   // 掛機

  function floatText(txt){
    const yard=document.querySelector('.yard');
    const el=document.createElement('div'); el.className='float'; el.textContent=txt;
    el.style.left=(30+Math.random()*120)+'px'; el.style.bottom='54px';
    yard.appendChild(el); setTimeout(()=>el.remove(),1000);
  }
  window.walk=()=>{ const g2=12+Math.floor(Math.random()*8); setCans(cans+g2); floatText('+'+g2+' 🥫'); };

  // ---- panels ----
  const panel=document.getElementById('panel');
  window.setTab=(tb)=>{ tab=tb;
    document.getElementById('tabRaise').classList.toggle('on',tb==='raise');
    document.getElementById('tabDecor').classList.toggle('on',tb==='decor');
    renderPanel();
  };
  function renderPanel(){
    if(tab==='raise') renderRaise(); else renderDecor();
  }
  function renderRaise(){
    panel.innerHTML='<div class="hint">餵食累積經驗，滿了就升級 → 影響對戰數值。</div>';
    pets.forEach((p,i)=>{
      const card=document.createElement('div'); card.className='petCard';
      const cv=document.createElement('canvas'); cv.width=40; cv.height=40;
      const c=cv.getContext('2d'); const gs=g; // draw pet into mini
      (function(ctx){ const G=(x,y,w,h,col)=>{ctx.fillStyle=col;ctx.fillRect(x,y,w,h);};
        const fur=p.fur,dark=shade(fur,.78),cat=p.type==='cat';
        if(cat){G(28,8,4,5,fur);} else {G(27,13,6,4,dark);}
        G(8,12,22,12,fur);
        if(cat){G(6,2,6,7,fur);G(20,2,6,7,fur);} else {G(2,5,7,12,dark);G(23,5,7,12,dark);}
        G(6,4,22,12,fur); G(12,9,2,2,'#241f1b'); G(22,9,2,2,'#241f1b'); G(17,11,3,2,'#5a3a2e');
      })(c);
      const pct=Math.round(p.exp/p.need*100);
      const info=document.createElement('div'); info.className='petInfo';
      info.innerHTML=`<div class="petName">${p.name} <span class="petLv">Lv.${p.lv}</span></div>
        <div class="bar"><span style="width:${pct}%"></span></div>`;
      const btn=document.createElement('button'); btn.className='feed'; btn.textContent='餵食 20🥫';
      btn.disabled = cans<20;
      btn.onclick=()=>{ if(cans<20) return; cans-=20; p.exp+=34;
        if(p.exp>=p.need){ p.lv++; p.exp-=p.need; p.need+=20; showToast('升級了！','🎉 '+p.name+' → Lv.'+p.lv); }
        canN.textContent=cans; renderPanel(); };
      card.append(cv,info,btn); panel.appendChild(card);
    });
  }
  function renderDecor(){
    panel.innerHTML='<div class="hint">買了會直接擺進院子，讓毛孩住得更舒服。</div>';
    SHOP.forEach(s=>{
      const row=document.createElement('div'); row.className='shopItem';
      const ico=document.createElement('div'); ico.className='ico'; ico.textContent=s.ico;
      const info=document.createElement('div'); info.className='petInfo';
      info.innerHTML=`<div class="petName">${s.label}</div><div class="petLv">${s.cost} 🥫</div>`;
      const buy=document.createElement('button');
      if(owned[s.k]){ buy.className='buy owned'; buy.textContent='已擺放'; }
      else { buy.className='buy'; buy.textContent='購買'; buy.disabled=cans<s.cost;
        if(cans<s.cost) buy.style.opacity=.45;
        buy.onclick=()=>{ if(cans<s.cost) return; cans-=s.cost; owned[s.k]=true;
          const slot=SLOTS[placed.length % SLOTS.length]; placed.push({k:s.k,x:slot[0],y:slot[1]});
          canN.textContent=cans; showToast('擺好了！',s.ico+' '+s.label+' 進駐院子'); renderPanel(); };
      }
      row.append(ico,info,buy); panel.appendChild(row);
    });
  }

  const toast=document.getElementById('toast');
  function showToast(t,n){ toast.innerHTML=`<div class="t">${t}</div><div class="n">${n}</div>`;
    toast.classList.remove('show'); void toast.offsetWidth; toast.classList.add('show'); }

  // 離線收益歡迎
  setTimeout(()=>{ const off=180; setCans(cans+off); showToast('歡迎回來！','離線收益 +'+off+' 🥫'); }, 500);

  renderPanel();
})();
</script>
