<title>PawDojo · 對戰畫面 mockup</title>
<style>
  :root{
    --bg:#F3E9DA; --bg2:#EADBC6; --ink:#2E2A26; --dim:#6E6558;
    --card:#FBF6EE; --line:#E7DFCE;
    --coral:#E8805C; --sage:#5E9B7E; --butter:#E7B24C; --teal:#3F8E8A;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    --sans:"ui-rounded","SF Pro Rounded",-apple-system,system-ui,"PingFang TC",sans-serif;
  }
  @media (prefers-color-scheme:dark){ :root{ --bg:#241d15; --bg2:#2f2619; --ink:#F3E9DA; --card:#2b2318; --line:#3a3020; --dim:#b3a892; } }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .wrap{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  .topbar{padding:14px 18px 6px;font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
  .arena{position:relative;flex:1;overflow:hidden;background:
      radial-gradient(120% 80% at 80% 0%, var(--bg2), transparent 60%),
      radial-gradient(100% 70% at 0% 100%, #E7EFE6, transparent 55%), var(--bg);
      padding:10px 16px}
  .arena.shake{animation:shake .32s}
  @keyframes shake{10%,90%{transform:translateX(-3px)}30%,70%{transform:translateX(5px)}50%{transform:translateX(-6px)}}

  .side{display:flex;align-items:center;gap:12px;margin:8px 0}
  .side.enemy{justify-content:flex-start}
  .side.mine{justify-content:flex-end;flex-direction:row-reverse}
  .avatar{width:96px;height:96px;border-radius:26px;background:#fff;box-shadow:0 10px 22px -10px rgba(70,45,20,.5);
     display:grid;place-items:center;position:relative;flex:none;border:3px solid #fff}
  .avatar svg{width:82%;height:82%}
  .avatar.hit{animation:hit .3s}
  @keyframes hit{0%{filter:none}20%{filter:brightness(3)}100%{filter:none}}
  .avatar.lunge-e{animation:lungeE .34s}
  .avatar.lunge-m{animation:lungeM .34s}
  @keyframes lungeE{40%{transform:translate(22px,12px)}}
  @keyframes lungeM{40%{transform:translate(-22px,-12px)}}
  .avatar.faint{animation:faint .6s forwards}
  @keyframes faint{to{transform:translateY(30px);opacity:0}}

  .hpbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;min-width:190px;box-shadow:0 6px 16px -10px rgba(70,45,20,.4)}
  .hprow1{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .nm{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px}
  .lv{font-size:12px;color:var(--dim);font-weight:800}
  .chip{font-size:11px;font-weight:800;color:#fff;padding:2px 8px;border-radius:999px}
  .track{height:12px;background:#EADFCB;border-radius:7px;overflow:hidden;margin-top:8px;border:1px solid rgba(0,0,0,.05)}
  .fill{height:100%;border-radius:7px;transition:width .5s ease, background .5s}
  .hpnum{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:3px;text-align:right}

  .dmg{position:absolute;font-weight:900;font-size:26px;color:var(--coral);text-shadow:0 2px 0 #fff;pointer-events:none;animation:floatUp .8s forwards}
  @keyframes floatUp{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
  .eff{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.6);font-weight:900;font-size:22px;
     color:var(--butter);text-shadow:0 2px 0 rgba(0,0,0,.15);opacity:0;pointer-events:none}
  .eff.show{animation:pop .9s}
  @keyframes pop{15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}

  /* 復古點綴：對話框戰報 + 招式選單 */
  .panel{background:var(--card);border-top:1px solid var(--line);padding:12px 16px 20px}
  .log{background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:52px;
     font-family:var(--mono);font-size:13.5px;line-height:1.45;color:var(--ink);box-shadow:inset 0 2px 6px rgba(0,0,0,.05)}
  .moves{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .move{border:0;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 10px;text-align:left;cursor:pointer;font-family:var(--sans);
     box-shadow:0 4px 0 rgba(0,0,0,.05);transition:transform .06s}
  .move:active{transform:translateY(2px)}
  .move[disabled]{opacity:.5;cursor:default}
  .move .mn{font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:6px}
  .move .mm{font-size:11px;color:var(--dim);font-family:var(--mono);margin-top:3px}

  .overlay{position:absolute;inset:0;background:rgba(30,25,20,.55);display:none;place-items:center;z-index:20;padding:24px}
  .overlay.show{display:grid}
  .result{background:var(--card);border-radius:22px;padding:24px;text-align:center;max-width:300px;box-shadow:0 20px 40px -12px rgba(0,0,0,.5)}
  .result h2{margin:0 0 6px;font-size:24px;font-weight:900}
  .result p{margin:0 0 16px;color:var(--dim);font-size:14px}
  .btn{border:0;background:var(--coral);color:#fff;font-family:var(--sans);font-weight:800;font-size:15px;padding:12px 22px;border-radius:999px;cursor:pointer}
  .note{max-width:440px;margin:0 auto;padding:14px 18px;color:var(--dim);font-size:12.5px;text-align:center}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="cat" viewBox="0 0 120 120">
    <path d="M28 46 L34 16 L58 40 Z" fill="var(--fur)"/><path d="M92 46 L86 16 L62 40 Z" fill="var(--fur)"/>
    <path d="M34 40 L37 25 L49 39 Z" fill="var(--fur2)"/><path d="M86 40 L83 25 L71 39 Z" fill="var(--fur2)"/>
    <circle cx="60" cy="68" r="35" fill="var(--fur)"/>
    <ellipse cx="60" cy="80" rx="21" ry="15" fill="var(--fur2)" opacity=".6"/>
    <circle cx="48" cy="65" r="5" fill="#2E2A26"/><circle cx="72" cy="65" r="5" fill="#2E2A26"/>
    <path d="M55 75 h10 l-5 5 Z" fill="#E8805C"/>
    <path d="M60 80 q-4 5 -9 3 M60 80 q4 5 9 3" stroke="#2E2A26" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <g stroke="#2E2A26" stroke-width="1.8" stroke-linecap="round" opacity=".55"><path d="M40 73 h-17"/><path d="M80 73 h17"/></g>
  </symbol>
  <symbol id="dog" viewBox="0 0 120 120">
    <ellipse cx="29" cy="58" rx="14" ry="27" fill="var(--fur2)"/><ellipse cx="91" cy="58" rx="14" ry="27" fill="var(--fur2)"/>
    <circle cx="60" cy="58" r="34" fill="var(--fur)"/>
    <ellipse cx="60" cy="77" rx="23" ry="18" fill="var(--fur2)"/>
    <circle cx="48" cy="54" r="5" fill="#2E2A26"/><circle cx="72" cy="54" r="5" fill="#2E2A26"/>
    <ellipse cx="60" cy="71" rx="6.5" ry="5" fill="#2E2A26"/>
    <path d="M60 76 v6 M60 82 q-6 4 -11 1 M60 82 q6 4 11 1" stroke="#2E2A26" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </symbol>
</svg>

<div class="wrap">
  <div class="topbar">⚔️ 大安森林公園道館 · 對戰</div>
  <div class="arena" id="arena">
    <div class="eff" id="eff"></div>

    <div class="side enemy">
      <div class="avatar" id="enemyAv"><svg style="--fur:#B98A63;--fur2:#E6C6A6"><use href="#dog"/></svg></div>
      <div class="hpbox">
        <div class="hprow1"><span class="nm">阿福 <span class="chip" style="background:#3F8E8A">💧黏人精</span></span><span class="lv">Lv.5</span></div>
        <div class="track"><div class="fill" id="enemyHp"></div></div>
        <div class="hpnum" id="enemyHpNum"></div>
      </div>
    </div>

    <div style="height:6px"></div>

    <div class="side mine">
      <div class="avatar" id="myAv"><svg style="--fur:#E8945C;--fur2:#F6C89E"><use href="#cat"/></svg></div>
      <div class="hpbox">
        <div class="hprow1"><span class="nm">麻糬 <span class="chip" style="background:#C0872E">⚡過動</span></span><span class="lv">Lv.5</span></div>
        <div class="track"><div class="fill" id="myHp"></div></div>
        <div class="hpnum" id="myHpNum"></div>
      </div>
    </div>

    <div class="overlay" id="overlay">
      <div class="result">
        <h2 id="resTitle"></h2>
        <p id="resSub"></p>
        <button class="btn" onclick="reset()">再戰一次</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="log" id="log">要出哪一招？</div>
    <div class="moves" id="moves"></div>
  </div>
</div>
<div class="note">這是對戰畫面提案 · 點招式試手感（假資料）。真 App 會用你上傳的寵物照片、真實數值與個性克制。</div>

<script>
(function(){
  var RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // 屬性克制：key beats val
  var BEATS = { proud:'derp', derp:'hyper', hyper:'clingy', clingy:'sturdy', sturdy:'proud' };
  function mult(atkT, defT){ if(BEATS[atkT]===defT) return 1.5; if(BEATS[defT]===atkT) return .75; return 1; }

  function F(o){ o.hp=o.maxHp; return o; }
  var me, foe, busy=false;
  function seed(){
    me = F({ name:'麻糬', type:'hyper', lv:5, maxHp:96, atk:78, def:60, spd:92,
      moves:[{n:'撲擊',p:45,acc:1},{n:'過動連踢',p:70,acc:.95},{n:'全力一擊',p:95,acc:.72}] });
    foe = F({ name:'阿福', type:'clingy', lv:5, maxHp:120, atk:64, def:78, spd:48,
      moves:[{n:'撲擊',p:45,acc:1},{n:'撒嬌纏繞',p:70,acc:.95},{n:'全力一擊',p:95,acc:.72}] });
  }

  var $=function(id){return document.getElementById(id)};
  function hpColor(p){ return p>50?'#5E9B7E':p>22?'#E7B24C':'#E8805C'; }
  function paint(){
    [['my',me],['enemy',foe]].forEach(function(x){
      var pct=Math.max(0,x[1].hp/x[1].maxHp*100);
      $(x[0]+'Hp').style.width=pct+'%';
      $(x[0]+'Hp').style.background=hpColor(pct);
      $(x[0]+'HpNum').textContent=Math.max(0,Math.round(x[1].hp))+' / '+x[1].maxHp;
    });
  }
  function renderMoves(){
    var el=$('moves'); el.innerHTML='';
    me.moves.forEach(function(m,i){
      var b=document.createElement('button'); b.className='move'; b.disabled=busy;
      b.innerHTML='<div class="mn">⚡ '+m.n+'</div><div class="mm">威力 '+m.p+' · 命中 '+Math.round(m.acc*100)+'%</div>';
      b.onclick=function(){ if(!busy) playerTurn(i); };
      el.appendChild(b);
    });
  }
  function log(t){ $('log').textContent=t; }
  function wait(ms){ return new Promise(function(r){ setTimeout(r, RM?0:ms); }); }

  function floatDmg(side, dmg){
    var av=$(side==='me'?'myAv':'enemyAv'); var r=av.getBoundingClientRect(); var a=$('arena').getBoundingClientRect();
    var s=document.createElement('div'); s.className='dmg'; s.textContent='-'+dmg;
    s.style.left=(r.left-a.left+30)+'px'; s.style.top=(r.top-a.top+10)+'px';
    $('arena').appendChild(s); setTimeout(function(){s.remove()},800);
  }
  function showEff(txt,color){ var e=$('eff'); e.textContent=txt; e.style.color=color; e.classList.remove('show'); void e.offsetWidth; e.classList.add('show'); }

  async function strike(attacker, atkKey, move){
    var defender = attacker===me?foe:me;
    var defKey = atkKey==='me'?'enemy':'me';
    // 前衝
    $(atkKey==='me'?'myAv':'enemyAv').classList.add(atkKey==='me'?'lunge-m':'lunge-e');
    log(attacker.name+' 使出 '+move.n+'！');
    await wait(320);
    $(atkKey==='me'?'myAv':'enemyAv').classList.remove('lunge-m','lunge-e');
    // 命中判定
    if(Math.random()>move.acc){ showEff('沒有命中！','#6E6558'); log(attacker.name+' 的攻擊沒有命中…'); await wait(700); return; }
    var m = mult(attacker.type, defender.type);
    var base = ((2*attacker.lv)/5+2)*(move.p*attacker.atk)/Math.max(1,defender.def)/50+2;
    var dmg = Math.max(1, Math.floor(base*m*(0.85+Math.random()*0.15)));
    defender.hp -= dmg;
    // 被打
    $(defKey==='me'?'myAv':'enemyAv').classList.add('hit');
    floatDmg(defKey, dmg);
    if(m>1){ showEff('效果絕佳！','#E8805C'); if(!RM){ $('arena').classList.add('shake'); setTimeout(function(){$('arena').classList.remove('shake')},320);} }
    else if(m<1){ showEff('效果不佳…','#6E6558'); }
    paint();
    await wait(520);
    $(defKey==='me'?'myAv':'enemyAv').classList.remove('hit');
  }

  function aiPick(){
    if(Math.random()<.3) return Math.floor(Math.random()*foe.moves.length);
    var best=0,bs=-1; foe.moves.forEach(function(m,i){ var s=m.p*m.acc*mult(foe.type,me.type); if(s>bs){bs=s;best=i;} }); return best;
  }
  function faint(who){
    var side=who===me?'my':'enemy'; $(side+'Av').classList.add('faint');
  }
  async function end(win){
    await wait(400); faint(win?foe:me); await wait(700);
    $('resTitle').textContent = win?'你贏了！👑':'落敗…';
    $('resSub').textContent = win?'麻糬成為新道館主，升到 Lv.6！':'再訓練一下，下次再來挑戰！';
    $('overlay').classList.add('show');
  }

  async function playerTurn(i){
    busy=true; renderMoves();
    var first = me.spd>=foe.spd ? [me,'me',me.moves[i], foe] : [foe,'enemy',foe.moves[aiPick()], me];
    var second;
    if(first[0]===me) second=[foe,'enemy',null,me]; else second=[me,'me',me.moves[i],foe];

    await strike(first[0], first[1], first[0]===me?me.moves[i]:foe.moves[aiPick()]);
    if(foe.hp<=0){ return end(true); }
    if(me.hp<=0){ return end(false); }

    var secMove = second[0]===me? me.moves[i] : foe.moves[aiPick()];
    await strike(second[0], second[1], secMove);
    if(me.hp<=0){ return end(false); }
    if(foe.hp<=0){ return end(true); }

    busy=false; renderMoves(); log('要出哪一招？');
  }

  window.reset=function(){ $('overlay').classList.remove('show'); $('myAv').classList.remove('faint'); $('enemyAv').classList.remove('faint'); seed(); paint(); busy=false; renderMoves(); log('要出哪一招？'); };
  seed(); paint(); renderMoves();
})();
</script>
