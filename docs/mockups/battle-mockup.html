<title>PawDojo · 對戰畫面 mockup</title>
<style>
  :root{
    --bg:#F3E9DA; --bg2:#EADBC6; --ink:#2E2A26; --dim:#6E6558;
    --card:#FBF6EE; --line:#E7DFCE;
    --coral:#E8805C; --sage:#5E9B7E; --butter:#E7B24C; --teal:#3F8E8A;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    --sans:"ui-rounded","SF Pro Rounded",-apple-system,system-ui,"PingFang TC",sans-serif;
  }
  @media (prefers-color-scheme:dark){ :root{ --bg:#241d15; --bg2:#2f2619; --ink:#F3E9DA; --card:#2b2318; --line:#3a3020; --dim:#b3a892; } }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .wrap{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  .topbar{padding:14px 18px 6px;font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
  .arena{position:relative;flex:1;overflow:hidden;background:
      radial-gradient(120% 80% at 80% 0%, var(--bg2), transparent 60%),
      radial-gradient(100% 70% at 0% 100%, #E7EFE6, transparent 55%), var(--bg);
      padding:10px 16px}
  .arena.shake{animation:shake .32s}
  @keyframes shake{10%,90%{transform:translateX(-3px)}30%,70%{transform:translateX(5px)}50%{transform:translateX(-6px)}}

  .side{display:flex;align-items:center;gap:12px;margin:8px 0}
  .side.enemy{justify-content:flex-start}
  .side.mine{justify-content:flex-end;flex-direction:row-reverse}
  .avatar{width:96px;height:96px;border-radius:26px;background:#fff;box-shadow:0 10px 22px -10px rgba(70,45,20,.5);
     display:grid;place-items:center;position:relative;flex:none;border:3px solid #fff}
  .avatar svg{width:82%;height:82%}
  .avatar.hit{animation:hit .3s}
  @keyframes hit{0%{filter:none}20%{filter:brightness(3)}100%{filter:none}}
  .avatar.lunge-e{animation:lungeE .34s}
  .avatar.lunge-m{animation:lungeM .34s}
  @keyframes lungeE{40%{transform:translate(22px,12px)}}
  @keyframes lungeM{40%{transform:translate(-22px,-12px)}}
  .avatar.faint{animation:faint .6s forwards}
  @keyframes faint{to{transform:translateY(30px);opacity:0}}

  .hpbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;min-width:190px;box-shadow:0 6px 16px -10px rgba(70,45,20,.4)}
  .hprow1{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .nm{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px}
  .lv{font-size:12px;color:var(--dim);font-weight:800}
  .chip{font-size:11px;font-weight:800;color:#fff;padding:2px 8px;border-radius:999px}
  .track{height:12px;background:#EADFCB;border-radius:7px;overflow:hidden;margin-top:8px;border:1px solid rgba(0,0,0,.05)}
  .fill{height:100%;border-radius:7px;transition:width .5s ease, background .5s}
  .hpnum{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:3px;text-align:right}

  .avatar svg{transition:filter .2s}
  .avatar.idle svg{animation:breathe 3.2s ease-in-out infinite}
  @keyframes breathe{50%{transform:translateY(-3px) scale(1.02)}}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:16}
  .flash.go{animation:flash .3s}
  @keyframes flash{0%{opacity:0}18%{opacity:.72}100%{opacity:0}}
  .particle{position:absolute;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:14;transition:transform .5s cubic-bezier(.2,.7,.3,1),opacity .5s}
  .ring{position:absolute;width:60px;height:60px;border-radius:50%;border:4px solid var(--butter);opacity:0;pointer-events:none;z-index:12}
  .ring.go{animation:ring .55s}
  @keyframes ring{0%{opacity:.85;transform:scale(.3)}100%{opacity:0;transform:scale(2)}}
  .particle.leaf{border-radius:2px 6px 2px 6px}
  .particle.rock{border-radius:3px}
  .bolt{position:absolute;width:3px;background:linear-gradient(#fff,#F2C230);transform-origin:top center;z-index:15;opacity:0;box-shadow:0 0 6px #F2C230}
  .bolt.go{animation:bolt .3s}
  @keyframes bolt{0%,100%{opacity:0}20%,60%{opacity:1}}
  .arena.jitter{animation:jitter .3s}
  @keyframes jitter{10%{transform:translate(-2px,1px)}30%{transform:translate(3px,-2px)}50%{transform:translate(-3px,2px)}70%{transform:translate(2px,-1px)}}
  .typebar{display:flex;gap:6px;flex-wrap:wrap;padding:6px 16px 2px}
  .tb{border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800;cursor:pointer;font-family:var(--sans);color:var(--ink)}
  .tb.on{color:#fff}
  .dmg{position:absolute;font-weight:900;font-size:26px;color:var(--coral);text-shadow:0 2px 0 #fff;pointer-events:none;animation:floatUp .85s cubic-bezier(.2,.9,.3,1) forwards}
  .dmg.super{font-size:36px;color:#E8805C}
  .dmg.weak{font-size:20px;color:#8a8375}
  @keyframes floatUp{0%{transform:translateY(6px) scale(.5);opacity:0}18%{transform:translateY(0) scale(1.25);opacity:1}32%{transform:scale(1)}100%{transform:translateY(-46px) scale(1);opacity:0}}
  .eff{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.6);font-weight:900;font-size:22px;
     color:var(--butter);text-shadow:0 2px 0 rgba(0,0,0,.15);opacity:0;pointer-events:none}
  .eff.show{animation:pop .9s}
  @keyframes pop{15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}

  /* 復古點綴：對話框戰報 + 招式選單 */
  .panel{background:var(--card);border-top:1px solid var(--line);padding:12px 16px 20px}
  .log{background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:52px;
     font-family:var(--mono);font-size:13.5px;line-height:1.45;color:var(--ink);box-shadow:inset 0 2px 6px rgba(0,0,0,.05)}
  .moves{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .move{border:0;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 10px;text-align:left;cursor:pointer;font-family:var(--sans);
     box-shadow:0 4px 0 rgba(0,0,0,.05);transition:transform .06s}
  .move:active{transform:translateY(2px)}
  .move[disabled]{opacity:.5;cursor:default}
  .move .mn{font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:6px}
  .move .mm{font-size:11px;color:var(--dim);font-family:var(--mono);margin-top:3px}

  .overlay{position:absolute;inset:0;background:rgba(30,25,20,.55);display:none;place-items:center;z-index:20;padding:24px}
  .overlay.show{display:grid}
  .result{background:var(--card);border-radius:22px;padding:24px;text-align:center;max-width:300px;box-shadow:0 20px 40px -12px rgba(0,0,0,.5)}
  .result h2{margin:0 0 6px;font-size:24px;font-weight:900}
  .result p{margin:0 0 16px;color:var(--dim);font-size:14px}
  .btn{border:0;background:var(--coral);color:#fff;font-family:var(--sans);font-weight:800;font-size:15px;padding:12px 22px;border-radius:999px;cursor:pointer}
  .note{max-width:440px;margin:0 auto;padding:14px 18px;color:var(--dim);font-size:12.5px;text-align:center}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="cat" viewBox="0 0 120 120">
    <path d="M28 46 L34 16 L58 40 Z" fill="var(--fur)"/><path d="M92 46 L86 16 L62 40 Z" fill="var(--fur)"/>
    <path d="M34 40 L37 25 L49 39 Z" fill="var(--fur2)"/><path d="M86 40 L83 25 L71 39 Z" fill="var(--fur2)"/>
    <circle cx="60" cy="68" r="35" fill="var(--fur)"/>
    <ellipse cx="60" cy="80" rx="21" ry="15" fill="var(--fur2)" opacity=".6"/>
    <circle cx="48" cy="65" r="5" fill="#2E2A26"/><circle cx="72" cy="65" r="5" fill="#2E2A26"/>
    <path d="M55 75 h10 l-5 5 Z" fill="#E8805C"/>
    <path d="M60 80 q-4 5 -9 3 M60 80 q4 5 9 3" stroke="#2E2A26" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <g stroke="#2E2A26" stroke-width="1.8" stroke-linecap="round" opacity=".55"><path d="M40 73 h-17"/><path d="M80 73 h17"/></g>
  </symbol>
  <symbol id="dog" viewBox="0 0 120 120">
    <ellipse cx="29" cy="58" rx="14" ry="27" fill="var(--fur2)"/><ellipse cx="91" cy="58" rx="14" ry="27" fill="var(--fur2)"/>
    <circle cx="60" cy="58" r="34" fill="var(--fur)"/>
    <ellipse cx="60" cy="77" rx="23" ry="18" fill="var(--fur2)"/>
    <circle cx="48" cy="54" r="5" fill="#2E2A26"/><circle cx="72" cy="54" r="5" fill="#2E2A26"/>
    <ellipse cx="60" cy="71" rx="6.5" ry="5" fill="#2E2A26"/>
    <path d="M60 76 v6 M60 82 q-6 4 -11 1 M60 82 q6 4 11 1" stroke="#2E2A26" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </symbol>
</svg>

<div class="wrap">
  <div class="topbar" style="justify-content:space-between">
    <span>⚔️ 大安森林公園道館 · 對戰</span>
    <button id="mute" onclick="toggleMute()" style="border:0;background:transparent;font-size:18px;cursor:pointer">🔊</button>
  </div>
  <div class="typebar" id="typebar"><span style="align-self:center;font-size:11px;color:var(--dim);font-weight:800">麻糬的個性：</span></div>
  <div class="arena" id="arena">
    <div class="flash" id="flash"></div>
    <div class="eff" id="eff"></div>

    <div class="side enemy">
      <div class="avatar idle" id="enemyAv"><svg style="--fur:#B98A63;--fur2:#E6C6A6"><use href="#dog"/></svg></div>
      <div class="hpbox">
        <div class="hprow1"><span class="nm">阿福 <span class="chip" style="background:#3F8E8A">💧黏人精</span></span><span class="lv">Lv.5</span></div>
        <div class="track"><div class="fill" id="enemyHp"></div></div>
        <div class="hpnum" id="enemyHpNum"></div>
      </div>
    </div>

    <div style="height:6px"></div>

    <div class="side mine">
      <div class="avatar idle" id="myAv"><svg style="--fur:#E8945C;--fur2:#F6C89E"><use href="#cat"/></svg></div>
      <div class="hpbox">
        <div class="hprow1"><span class="nm">麻糬 <span class="chip" id="myChip" style="background:#C0872E">⚡過動</span></span><span class="lv">Lv.5</span></div>
        <div class="track"><div class="fill" id="myHp"></div></div>
        <div class="hpnum" id="myHpNum"></div>
      </div>
    </div>

    <div class="overlay" id="overlay">
      <div class="result">
        <h2 id="resTitle"></h2>
        <p id="resSub"></p>
        <button class="btn" onclick="reset()">再戰一次</button>
      </div>
    </div>

    <div class="overlay show" id="startOv">
      <div class="result">
        <h2>準備對戰！</h2>
        <p>麻糬 挑戰道館主 阿福<br>點擊開始（含音樂與音效 🔊）</p>
        <button class="btn" onclick="begin()">⚔️ 開始對戰</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="log" id="log">要出哪一招？</div>
    <div class="moves" id="moves"></div>
  </div>
</div>
<div class="note">這是對戰畫面提案 · 點招式試手感（假資料）。真 App 會用你上傳的寵物照片、真實數值與個性克制。</div>

<script>
(function(){
  var RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ===== 音效 / 背景音樂（Web Audio 合成，零素材） ===== */
  var A, master, muted=false, bgmTimer=null, bstep=0, audioReady=false;
  function AC(){ if(!A){ try{ A=new (window.AudioContext||window.webkitAudioContext)(); master=A.createGain(); master.gain.value=0.6; master.connect(A.destination); }catch(e){} } if(A&&A.state==='suspended') A.resume(); return A; }
  function out(){ var a=AC(); return master||(a&&a.destination); }
  // 可疊二個微失諧振盪器變厚
  function osc(freq,dur,type,g,sweep,det){ var a=AC(); if(!a||muted||!freq) return; var gn=a.createGain(); gn.gain.setValueAtTime(0.0001,a.currentTime); gn.gain.exponentialRampToValueAtTime(g||0.12,a.currentTime+0.012); gn.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur); gn.connect(out());
    var dets = det? [-det,det] : [0];
    dets.forEach(function(dt){ var o=a.createOscillator(); o.type=type||'square'; o.frequency.setValueAtTime(freq,a.currentTime); if(dt)o.detune.value=dt; if(sweep)o.frequency.exponentialRampToValueAtTime(sweep,a.currentTime+dur); o.connect(gn); o.start(); o.stop(a.currentTime+dur+0.03); }); }
  function noise(dur,g,freq,ftype){ var a=AC(); if(!a||muted) return; var s=a.createBufferSource(),b=a.createBuffer(1,Math.max(1,a.sampleRate*dur),a.sampleRate),d=b.getChannelData(0); for(var i=0;i<d.length;i++) d[i]=Math.random()*2-1; s.buffer=b; var f=a.createBiquadFilter(); f.type=ftype||'lowpass'; f.frequency.value=freq||2000; var gn=a.createGain(); gn.gain.setValueAtTime(g||0.2,a.currentTime); gn.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur); s.connect(f); f.connect(gn); gn.connect(out()); s.start(); s.stop(a.currentTime+dur+0.03); }
  function kick(){ osc(150,0.16,'sine',0.5,45); noise(0.05,0.35,220); }
  function hat(){ noise(0.028,0.1,8000,'highpass'); }
  function snare(){ noise(0.13,0.28,3200); osc(220,0.08,'triangle',0.1); }

  // 招式音效（多層疊加、更厚更炫）
  function sfx(fx,tier){
    if(fx==='fire'){ noise(0.42,0.26,1400); osc(280,0.34,'sawtooth',0.1,90,10); osc(90,0.4,'sine',0.2,45); }
    else if(fx==='leaf'){ [880,1174,1568].forEach(function(f,i){ setTimeout(function(){osc(f,0.14,'triangle',0.09,null,6)},i*45); }); }
    else if(fx==='bolt'){ osc(1850,0.06,'square',0.14,300); noise(0.16,0.18,5200,'highpass'); setTimeout(function(){osc(1400,0.05,'square',0.1,500)},60); }
    else if(fx==='water'){ [700,900,600,1050].forEach(function(f,i){ setTimeout(function(){osc(f,0.1,'sine',0.11,f*2)},i*38); }); }
    else if(fx==='rock'){ osc(70,0.42,'sine',0.3,38); noise(0.36,0.32,650); setTimeout(function(){osc(55,0.3,'sine',0.22,34)},80); }
    if(tier===3){ setTimeout(function(){sfx(fx,1)},150); setTimeout(function(){sfx(fx,1)},310); }
  }
  function charge(){ osc(180,0.5,'sawtooth',0.11,820,4); noise(0.5,0.05,3000,'highpass'); }
  function sHit(){ noise(0.09,0.2,1700); osc(120,0.06,'sine',0.14,60); }
  function sSuper(){ [660,830,990].forEach(function(f,i){ setTimeout(function(){osc(f,0.18,'square',0.1,null,6)},i*30); }); }

  // 背景音樂：lead + bass + 鼓組（更驅動）
  var LEAD=[440,523,659,523, 587,523,440,392, 349,392,440,523, 659,587,523,0];
  var BASS=[110,0,110,110, 98,0,98,98, 87,0,87,87, 98,0,110,0];
  function bgmStep(){ if(!muted){ var s=bstep%16;
      if(LEAD[s]) osc(LEAD[s],0.14,'square',0.055,null,7);
      if(BASS[s]) osc(BASS[s],0.17,'triangle',0.08);
      if(s%4===0) kick(); if(s%2===1) hat(); if(s===4||s===12) snare();
    } bstep++; }
  function startBGM(){ stopBGM(); bstep=0; bgmTimer=setInterval(bgmStep,150); }
  function stopBGM(){ if(bgmTimer){ clearInterval(bgmTimer); bgmTimer=null; } }
  function playStart(){ audioReady=true; var a=AC(); if(!a)return; [392,523,659,784,659].forEach(function(f,i){ setTimeout(function(){osc(f,0.15,'square',0.11,null,6); if(i===4)kick()},i*85); }); setTimeout(startBGM,500); }
  function playWin(){ stopBGM(); var m=[523,659,784,1046,988,1046]; m.forEach(function(f,i){ setTimeout(function(){ osc(f,0.26,'triangle',0.14,null,6); osc(f/2,0.26,'square',0.05); if(i===3){kick();} },i*140); }); }
  function playLose(){ stopBGM(); [[440,349],[392,330],[294,247]].forEach(function(pr,i){ setTimeout(function(){ osc(pr[0],0.42,'sawtooth',0.11,pr[0]*0.85); osc(pr[1],0.42,'triangle',0.06); },i*220); }); }

  // 屬性克制：key beats val
  var BEATS = { proud:'derp', derp:'hyper', hyper:'clingy', clingy:'sturdy', sturdy:'proud' };
  function mult(atkT, defT){ if(BEATS[atkT]===defT) return 1.5; if(BEATS[defT]===atkT) return .75; return 1; }

  var TYPES = {
    proud:  {label:'傲嬌', emoji:'🔥', color:'#E8805C', p:'#F0642F', fx:'fire',  sig:'傲嬌爆擊'},
    derp:   {label:'天然呆', emoji:'🌿', color:'#5E9B7E', p:'#5E9B7E', fx:'leaf',  sig:'呆萌一擊'},
    hyper:  {label:'過動', emoji:'⚡', color:'#C0872E', p:'#F2C230', fx:'bolt',  sig:'過動連踢'},
    clingy: {label:'黏人精', emoji:'💧', color:'#3F8E8A', p:'#49A9C7', fx:'water', sig:'撒嬌纏繞'},
    sturdy: {label:'憨厚', emoji:'🪨', color:'#8A6A3A', p:'#9A7B4A', fx:'rock',  sig:'憨厚重壓'},
  };
  var myType = 'hyper';

  // 招式：寵物行為 × 元素/個性（惡趣味）
  var MOVES = {
    proud:  [{n:'不理你尾巴甩',p:45,acc:1},{n:'傲嬌正義拳',p:70,acc:.95},{n:'爆氣兔子蹬',p:95,acc:.72}],
    derp:   [{n:'放空盯空氣',p:45,acc:1},{n:'呆萌翻肚肚',p:70,acc:.95},{n:'亂入螃蟹步',p:95,acc:.72}],
    hyper:  [{n:'半夜暴衝',p:45,acc:1},{n:'風火輪衝刺',p:70,acc:.95},{n:'電流連環蹬',p:95,acc:.72}],
    clingy: [{n:'淚眼汪汪',p:45,acc:1},{n:'撒嬌踏踏',p:70,acc:.95},{n:'纏人水牢',p:95,acc:.72}],
    sturdy: [{n:'憨憨坐好',p:45,acc:1},{n:'拆家重擊',p:70,acc:.95},{n:'泰山壓頂',p:95,acc:.72}],
  };
  function F(o){ o.hp=o.maxHp; return o; }
  var me, foe, busy=false;
  function movesOf(t){ return MOVES[t].map(function(m){return {n:m.n,p:m.p,acc:m.acc}}); }
  function seed(){
    me = F({ name:'麻糬', type:myType, lv:5, maxHp:96, atk:78, def:60, spd:92, moves:movesOf(myType) });
    foe = F({ name:'阿福', type:'clingy', lv:5, maxHp:120, atk:64, def:78, spd:48, moves:movesOf('clingy') });
    var c=TYPES[myType];
    $('myChip').style.background=c.color; $('myChip').textContent=c.emoji+c.label;
  }
  function renderTypebar(){
    var bar=$('typebar');
    Object.keys(TYPES).forEach(function(k){
      var t=TYPES[k]; var b=document.createElement('button'); b.className='tb'+(k===myType?' on':'');
      if(k===myType) b.style.background=t.color;
      b.textContent=t.emoji+t.label;
      b.onclick=function(){ if(busy) return; myType=k; window.reset(); renderTypebar(); };
      bar.appendChild(b);
    });
  }

  var $=function(id){return document.getElementById(id)};
  function hpGrad(p){
    var a = p>50?'#6FB08E':p>22?'#EBBE5C':'#EE9270';
    var b = p>50?'#4F8F6C':p>22?'#D19A2E':'#D2643F';
    return 'linear-gradient(180deg,'+a+','+b+')';
  }
  function paint(){
    [['my',me],['enemy',foe]].forEach(function(x){
      var pct=Math.max(0,x[1].hp/x[1].maxHp*100);
      $(x[0]+'Hp').style.width=pct+'%';
      $(x[0]+'Hp').style.backgroundImage=hpGrad(pct);
      $(x[0]+'HpNum').textContent=Math.max(0,Math.round(x[1].hp))+' / '+x[1].maxHp;
    });
  }
  function avCenter(side){
    var av=$(side==='me'?'myAv':'enemyAv'); var r=av.getBoundingClientRect(); var a=$('arena').getBoundingClientRect();
    return { x:r.left-a.left+r.width/2, y:r.top-a.top+r.height/2 };
  }
  function particles(side, opt){
    if(RM) return;
    var c=avCenter(side), n=opt.n||8, ox=opt.ox||0, oy=opt.oy||0, dist=opt.dist||1;
    for(var k=0;k<n;k++){
      var p=document.createElement('div'); p.className='particle'+(opt.shape?(' '+opt.shape):'');
      p.style.background=opt.color; if(opt.size){p.style.width=p.style.height=opt.size+'px';}
      p.style.left=(c.x+ox-4)+'px'; p.style.top=(c.y+oy-4)+'px'; $('arena').appendChild(p);
      (function(el){
        requestAnimationFrame(function(){
          var ang, d=(24+Math.random()*38)*dist;
          if(opt.rise) ang = -Math.PI/2 + (Math.random()-0.5)*1.4;       // 往上（火/餘燼）
          else if(opt.fall) ang = Math.PI/2 + (Math.random()-0.5)*1.6;    // 往下（碎石）
          else ang = Math.random()*6.28;                                   // 四散
          var rot = opt.spin? ' rotate('+(Math.random()*360)+'deg)':'';
          el.style.transform='translate('+Math.cos(ang)*d+'px,'+Math.sin(ang)*d+'px) scale('+(0.4+Math.random()*0.7)+')'+rot;
          el.style.opacity='0';
        });
        setTimeout(function(){el.remove()},520);
      })(p);
    }
  }
  function ring(side, color, opt){
    if(RM) return; opt=opt||{};
    var c=avCenter(side), sz=opt.size||60; var r=document.createElement('div'); r.className='ring';
    if(color) r.style.borderColor=color; r.style.width=r.style.height=sz+'px';
    r.style.left=(c.x+(opt.ox||0)-sz/2)+'px'; r.style.top=(c.y+(opt.oy||0)-sz/2)+'px'; $('arena').appendChild(r);
    void r.offsetWidth; r.classList.add('go'); setTimeout(function(){r.remove()},560);
  }
  function bolts(side, off){
    if(RM) return; off=off||{x:0,y:0};
    var c=avCenter(side);
    for(var i=0;i<3;i++){
      var b=document.createElement('div'); b.className='bolt';
      var h=c.y+off.y+ (Math.random()*20); b.style.height=h+'px'; b.style.top='0px';
      b.style.left=(c.x+off.x-20+i*18+Math.random()*6)+'px';
      b.style.transform='rotate('+((Math.random()-0.5)*24)+'deg)';
      $('arena').appendChild(b); void b.offsetWidth; b.classList.add('go');
      setTimeout(function(el){return function(){el.remove()}}(b),320);
    }
  }
  function flash(){ if(RM) return; var f=$('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
  function jitter(){ if(RM) return; var a=$('arena'); a.classList.add('jitter'); setTimeout(function(){a.classList.remove('jitter')},300); }
  function shake(){ if(RM) return; var a=$('arena'); a.classList.add('shake'); setTimeout(function(){a.classList.remove('shake')},320); }

  // 單段元素爆發（tier 影響粒子量/範圍/光圈大小）
  function burst(type, side, tier, off){
    var t=TYPES[type], col=t.p, n=5+tier*4, dist=1+(tier-1)*0.45, sz=48+tier*22;
    var base={color:col,n:n,dist:dist,ox:off.x,oy:off.y};
    if(t.fx==='fire'){ particles(side,merge(base,{rise:true,size:10})); ring(side,'#F0642F',{ox:off.x,oy:off.y,size:sz}); flash(); }
    else if(t.fx==='leaf'){ particles(side,merge(base,{shape:'leaf',spin:true,size:11})); ring(side,'#7FB88F',{ox:off.x,oy:off.y,size:sz}); }
    else if(t.fx==='bolt'){ bolts(side,off); particles(side,merge(base,{size:7})); flash(); jitter(); }
    else if(t.fx==='water'){ ring(side,'#49A9C7',{ox:off.x,oy:off.y,size:sz}); setTimeout(function(){ring(side,'#8FD0E6',{ox:off.x,oy:off.y,size:sz+16})},110); particles(side,merge(base,{size:9})); }
    else if(t.fx==='rock'){ particles(side,merge(base,{fall:true,shape:'rock',size:12})); ring(side,'#9A7B4A',{ox:off.x,oy:off.y,size:sz}); shake(); }
    else { particles(side,base); }
  }
  function merge(a,b){ var o={}; for(var k in a)o[k]=a[k]; for(var k2 in b)o[k2]=b[k2]; return o; }

  // 依威力分級：小招 1 段、中招 2 段、大招 3 段連爆 + 大範圍 + 強震
  function typeFx(type, side, power){
    var tier = power>=90 ? 3 : power>=65 ? 2 : 1;
    for(var w=0; w<tier; w++){
      (function(wi){
        setTimeout(function(){
          var spread = tier===3?70:34;
          var off = wi===0 ? {x:0,y:0} : { x:(Math.random()-0.5)*spread, y:(Math.random()-0.5)*spread*0.7 };
          burst(type, side, tier, off);
          if(tier===3 && wi>0) flash();
        }, wi*150);
      })(w);
    }
    if(tier>=2) setTimeout(shake, (tier-1)*150);
  }
  function renderMoves(){
    var el=$('moves'); el.innerHTML='';
    me.moves.forEach(function(m,i){
      var b=document.createElement('button'); b.className='move'; b.disabled=busy;
      b.innerHTML='<div class="mn">'+TYPES[me.type].emoji+' '+m.n+'</div><div class="mm">威力 '+m.p+' · 命中 '+Math.round(m.acc*100)+'%</div>';
      b.onclick=function(){ if(!busy) playerTurn(i); };
      el.appendChild(b);
    });
  }
  function log(t){ $('log').textContent=t; }
  function wait(ms){ return new Promise(function(r){ setTimeout(r, RM?0:ms); }); }

  function floatDmg(side, dmg, eff){
    var c=avCenter(side);
    var s=document.createElement('div'); s.className='dmg'+(eff==='super'?' super':eff==='weak'?' weak':''); s.textContent='-'+dmg;
    s.style.left=(c.x-6)+'px'; s.style.top=(c.y-24)+'px';
    $('arena').appendChild(s); setTimeout(function(){s.remove()},860);
  }
  function showEff(txt,color){ var e=$('eff'); e.textContent=txt; e.style.color=color; e.classList.remove('show'); void e.offsetWidth; e.classList.add('show'); }

  async function strike(attacker, atkKey, move){
    var defender = attacker===me?foe:me;
    var defKey = atkKey==='me'?'enemy':'me';
    // 前衝
    $(atkKey==='me'?'myAv':'enemyAv').classList.add(atkKey==='me'?'lunge-m':'lunge-e');
    log(attacker.name+' 使出 '+move.n+'！');
    if(move.p>=90) charge();
    await wait(320);
    $(atkKey==='me'?'myAv':'enemyAv').classList.remove('lunge-m','lunge-e');
    // 命中判定
    if(Math.random()>move.acc){ showEff('沒有命中！','#6E6558'); log(attacker.name+' 的攻擊沒有命中…'); await wait(700); return; }
    var m = mult(attacker.type, defender.type);
    var base = ((2*attacker.lv)/5+2)*(move.p*attacker.atk)/Math.max(1,defender.def)/50+2;
    var dmg = Math.max(1, Math.floor(base*m*(0.85+Math.random()*0.15)));
    var eff = m>1?'super':m<1?'weak':'normal';
    var tier = move.p>=90?3:move.p>=65?2:1;
    defender.hp -= dmg;
    // 命中特效 + 音效（依攻擊方屬性）
    var dav = $(defKey==='me'?'myAv':'enemyAv');
    dav.classList.add('hit');
    typeFx(attacker.type, defKey, move.p);
    sfx(TYPES[attacker.type].fx, tier); sHit();
    floatDmg(defKey, dmg, eff);
    if(m>1){ showEff('效果絕佳！', TYPES[attacker.type].color); sSuper(); }
    else if(m<1){ showEff('效果不佳…','#6E6558'); }
    await wait(90); // 命中頓格，增加重量感
    paint();
    await wait(480);
    dav.classList.remove('hit');
  }

  function aiPick(){
    if(Math.random()<.3) return Math.floor(Math.random()*foe.moves.length);
    var best=0,bs=-1; foe.moves.forEach(function(m,i){ var s=m.p*m.acc*mult(foe.type,me.type); if(s>bs){bs=s;best=i;} }); return best;
  }
  function faint(who){
    var side=who===me?'my':'enemy'; var el=$(side+'Av'); el.classList.remove('idle'); el.classList.add('faint');
  }
  async function end(win){
    await wait(300);
    if(win) playWin(); else playLose();
    faint(win?foe:me); await wait(700);
    $('resTitle').textContent = win?'你贏了！👑':'落敗…';
    $('resSub').textContent = win?'麻糬成為新道館主，升到 Lv.6！':'再訓練一下，下次再來挑戰！';
    $('overlay').classList.add('show');
  }

  async function playerTurn(i){
    busy=true; renderMoves();
    var first = me.spd>=foe.spd ? [me,'me',me.moves[i], foe] : [foe,'enemy',foe.moves[aiPick()], me];
    var second;
    if(first[0]===me) second=[foe,'enemy',null,me]; else second=[me,'me',me.moves[i],foe];

    await strike(first[0], first[1], first[0]===me?me.moves[i]:foe.moves[aiPick()]);
    if(foe.hp<=0){ return end(true); }
    if(me.hp<=0){ return end(false); }

    var secMove = second[0]===me? me.moves[i] : foe.moves[aiPick()];
    await strike(second[0], second[1], secMove);
    if(me.hp<=0){ return end(false); }
    if(foe.hp<=0){ return end(true); }

    busy=false; renderMoves(); log('要出哪一招？');
  }

  window.begin=function(){ $('startOv').classList.remove('show'); playStart(); busy=false; renderMoves(); log('要出哪一招？'); };
  window.toggleMute=function(){ muted=!muted; $('mute').textContent=muted?'🔇':'🔊'; if(muted) stopBGM(); else if(audioReady && !$('overlay').classList.contains('show')) startBGM(); };
  window.reset=function(){ $('overlay').classList.remove('show');
    ['myAv','enemyAv'].forEach(function(id){ $(id).classList.remove('faint'); $(id).classList.add('idle'); });
    seed(); paint(); busy=false; renderMoves(); log('要出哪一招？');
    if(audioReady) startBGM(); };
  busy=true; seed(); paint(); renderMoves(); renderTypebar();
})();
</script>
